[project]
name = "narrator"
version = "2.0.0"
description = "Narrator v2 - long-form TTS narration platform (single-box KVM 2)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2.4",
    "arq>=0.26",
    "redis>=5",
    "httpx>=0.27",
    "structlog>=24.1",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.9",
    "tenacity>=9.0",
    "sse-starlette>=2.1",
    "pymupdf>=1.24",
    "google-api-python-client>=2.140",
    "google-auth>=2.33",
    "google-auth-oauthlib>=1.2",
    "google-genai>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
tts = [
    "kokoro-onnx>=0.4.9",
    "onnxruntime>=1.18",
    "soundfile>=0.12",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "fakeredis>=2.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narrator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "services", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "ASYNC"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately do synchronous file IO inside async test functions.
"tests/**" = ["ASYNC230", "ASYNC240", "ASYNC251"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "services"]
addopts = "-q"
markers = [
    "chaos: compose-driven fault-injection tests (deselected by default)",
]
