# Article narration stack. No host ports. Joins the existing Coolify network
# so ainexus can reach http://narration-orchestrator:8870 without publishing 8080/8090.
# Redis is the existing Coolify Redis (DB 1) — do not add a Redis service here.
#
# Network aliases are required: Coolify container names are UUIDs, so ainexus
# (on the coolify network) can only resolve these DNS names via aliases.

services:
  narration-tts:
    build:
      context: .
      dockerfile: services/tts/Dockerfile
    hostname: narration-tts
    environment:
      ONNX_INTRA_OP: "1"
    volumes:
      - narration-tts-models:/models
    mem_limit: 1200m
    cpus: "1.0"
    cpu_shares: 512
    expose:
      - "8880"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 600s
    restart: unless-stopped
    labels:
      - traefik.enable=false
    networks:
      coolify:
        aliases:
          - narration-tts

  narration-orchestrator:
    build:
      context: .
      dockerfile: narration/Dockerfile
    hostname: narration-orchestrator
    environment:
      REDIS_URL: ${REDIS_URL}
      REDIS_KEY_PREFIX: narration:
      REDIS_TTL_SECONDS: "691200"
      NARRATION_REAPER_AGE_HOURS: "168"
      NARRATION_API_KEY: ${NARRATION_API_KEY}
      DATA_DIR: /data
      TTS_BASE_URL: http://narration-tts:8880/v1
      TTS_VOICE: am_onyx
      TTS_SPEED: "0.9"
      LLM_MODEL: ${NARRATION_MODEL:-gemini-2.5-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?}
      GOOGLE_TTS_SA_JSON: ${GOOGLE_TTS_SA_JSON:?}
      NARRATION_DAILY_TTS_CHARS: ${NARRATION_DAILY_TTS_CHARS:-60000}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-}
      NARRATION_DAILY_LLM_CAP: ${NARRATION_DAILY_LLM_CAP:-150}
      MODEL_VERSION: qwen3.5-4b-q4km+kokoro-int8-v1.0
      AUDIO_FORMAT: opus
      AUDIO_BITRATE: "32000"
      HD_BITRATE: "48000"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - narration-data:/data
    mem_limit: 768m
    cpu_shares: 256
    expose:
      - "8870"
    depends_on:
      - narration-tts
    restart: unless-stopped
    labels:
      - traefik.enable=false
    networks:
      coolify:
        aliases:
          - narration-orchestrator

networks:
  coolify:
    external: true

volumes:
  narration-tts-models: {}
  narration-data: {}
